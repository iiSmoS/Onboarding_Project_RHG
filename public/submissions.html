<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Form Submissions — Onboarding Control Tower</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <img src="img/rhg-logojpg.jpg" alt="Radisson Hotel Group" class="brand-logo">
      <span class="brand-divider"></span>
      <div>
        <h1>Onboarding Control Tower</h1>
        <p class="brand-sub">Track every hotel from first contact to go-live</p>
      </div>
    </div>
    <nav class="navbar">
      <a href="index.html" class="nav-link">Hotels</a>
      <a href="submissions.html" class="nav-link active">Form Submissions</a>
    </nav>
  </div>
</header>

<main class="layout--single">
  <section class="panel panel--upload">
    <div class="upload-head">
      <h2>Import form responses</h2>
      <p class="upload-hint">Upload the Excel export from the onboarding form. Rows are matched by SITA code.</p>
    </div>
    <form id="upload-form">
      <input type="file" id="excel-file" accept=".xlsx,.xls" required>
      <button type="submit">Upload</button>
    </form>
    <p id="upload-status"></p>
  </section>

  <section class="panel">
    <div class="panel-header">
      <div class="panel-header__title">
        <h2>Form Submissions</h2>
        <span class="count-pill" id="submissions-count">0</span>
      </div>
      <input type="search" id="submissions-search" class="sub-search"
             placeholder="Search hotel, SITA, country, GM…">
    </div>
    <p id="import-status-line" class="import-status"></p>
    <div id="submissions-body" class="sub-list"></div>
  </section>
</main>

<script src="submissions.js"></script>
</body>
</html>
